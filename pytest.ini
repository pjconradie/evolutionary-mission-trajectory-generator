[pytest]
testpaths = tests
addopts = -ra
markers =
	unit: isolated tests without external services
	integration: tests that exercise external tools or combined components
	regression: tests that preserve established EMTG behavior and baselines
	docker: tests that require the Docker CLI and daemon
	toolchain: tests that validate the pinned Linux build environment
	none_backend: tests for the solver-neutral NONE backend
	ipopt_backend: tests for the open-source IPOPT backend
	compile: tests that configure or compile native targets
	solver_runtime: tests that execute a native NLP solver
	clean_bootstrap: tests that rebuild the toolchain without caches
	toolchain_parity: temporary comparison of monolithic and split Docker probes
